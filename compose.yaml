services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    env_file:
      - .env

    command: ["alembic", "upgrade", "head"]

    depends_on:
      db:
        condition: service_healthy

    restart: "no"

  api:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5

  # Step 13.6 — Continuous Resolution Worker
  resolution-worker:
    build: .
    restart: unless-stopped

    env_file:
      - .env

    command:
      - python
      - -u
      - scripts/run_continuous_resolution.py
      - --batch-size
      - "100"
      - --poll-interval
      - "10"

    depends_on:
      db:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data: